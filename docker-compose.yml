# docker compose up -d --build   (reads secrets from .env on the server)
services:
  mithaq:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
    env_file: .env
    ports:
      - "3000:3000"
    restart: unless-stopped
